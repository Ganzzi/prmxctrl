
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v4

    - name: Install dependencies
      run: uv sync --all-groups --all-extras

    - name: Generate SDK
      run: uv run python tools/generate.py --force

    - name: Run validation
      run: uv run python tools/validate.py

    - name: Run tests
      run: uv run pytest -m "not integration and not e2e" -q --cov=prmxctrl --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@v4

    - name: Install dependencies
      run: uv sync --all-groups --all-extras

    - name: Run ruff
      run: uv run ruff check .

    - name: Run mypy
      run: uv run mypy prmxctrl/

    - name: Check formatting
      run: uv run black --check . && uv run isort --check-only .